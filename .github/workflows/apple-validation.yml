name: Apple validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Portable Swift tests (CampCore, Campgrounds, DocumentVault)
        run: swift test
  persistence:
    # The Xcode 27 image (macOS 27, Apple silicon). `macos-latest` still maps to macOS 26 with the iOS 26 SDK.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show the selected Xcode and iOS SDK
        run: xcodebuild -version && xcrun --sdk iphonesimulator --show-sdk-version
      # Runs the package tests (including SwiftData), validates the project, and builds the app for the
      # iOS Simulator at the iOS 27 target. It fails if the selected SDK is older than iOS 27.
      - name: Validate the package and build the iOS app with the iOS 27 SDK
        run: ./scripts/check.sh --native
      - name: Show crash reports
        if: failure()
        run: find ~/Library/Logs/DiagnosticReports -name '*.ips' -mmin -30 -exec sh -c 'echo "== $1"; head -c 8000 "$1"' _ {} \; || true
