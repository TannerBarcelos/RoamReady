name: Apple validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Portable Swift tests (CampCore, Campgrounds, DocumentVault)
        run: swift test
  persistence:
    # The Xcode 27 image (macOS 27, Apple silicon).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require Xcode with the iOS 27 SDK
        run: |
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iOS Simulator SDK: $SDK_VERSION"
          test "${SDK_VERSION%%.*}" -ge 27
      - name: Swift package and SwiftData store tests
        run: swift test
      - name: Validate project, privacy, and Apple capabilities
        run: |
          plutil -lint RoamReady.xcodeproj/project.pbxproj Camp/Info.plist Camp/Camp.entitlements Camp/PrivacyInfo.xcprivacy Config/Cloud.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.weatherkit' Config/Cloud.entitlements)" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-services:0' Config/Cloud.entitlements)" = CloudKit
          /usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' Camp/Info.plist > /dev/null
      - name: Build Debug and Release for Simulator
        run: |
          for BUILD_CONFIGURATION in Debug Release; do
            xcodebuild -project RoamReady.xcodeproj -scheme RoamReady -configuration "$BUILD_CONFIGURATION" \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath .derivedData \
              CODE_SIGNING_ALLOWED=NO build
          done
      - name: Boot the Simulator and warm up the app's first launch
        # A cold Simulator can make the first UI test's launch exceed Xcode's launch timeout,
        # so finish booting and pay for the first install and launch before testing.
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, items in devices.items() if "iOS-27" in runtime for d in items if d["name"].startswith("iPhone")))')"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" .derivedData/Build/Products/Debug-iphonesimulator/RoamReady.app
          xcrun simctl launch "$SIMULATOR_ID" com.example.RoamReady
          sleep 5
          xcrun simctl terminate "$SIMULATOR_ID" com.example.RoamReady
      - name: Assistant unavailable screens and text-only chat UI
        run: |
          xcodebuild -project RoamReady.xcodeproj -scheme RoamReady -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath .derivedData \
            -only-testing:RoamReadyUITests -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test
      - name: Show crash reports
        if: failure()
        run: find ~/Library/Logs/DiagnosticReports -name '*.ips' -mmin -30 -exec head -c 8000 {} \; || true
