name: Mac
# The Swift packages build for macOS, so their tests run here natively, SwiftData against real stores included.
# The app itself is iPhone and iPad only; the iOS and iPad workflows build and test it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch or PR replaces a run that is still going.
concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    name: Packages
    # The Xcode 27 image (macOS 27, Apple silicon).
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build packages and tests
        run: swift build --build-tests

      - name: Unit tests
        run: swift test --skip-build --parallel
