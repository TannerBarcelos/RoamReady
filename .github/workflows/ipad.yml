name: iPad
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch or PR replaces a run that is still going.
concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipad:
    uses: ./.github/workflows/simulator.yml
    with:
      device: iPad
