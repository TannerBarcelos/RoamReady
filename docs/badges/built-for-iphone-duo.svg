<svg xmlns="http://www.w3.org/2000/svg" width="160" height="20" role="img" aria-label="Built for: iPhone Duo">
  <title>Built for: iPhone Duo</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r"><rect width="160" height="20" rx="3" fill="#fff"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="82" height="20" fill="#555"/>
    <rect x="82" width="78" height="20" fill="#0a84ff"/>
    <rect width="160" height="20" fill="url(#s)"/>
  </g>
  <!-- An open, two-panel device: the inner display beside the cover. -->
  <g fill="none" stroke="#fff" stroke-width="1.2">
    <rect x="6.5" y="5" width="6" height="10" rx="1.2"/>
    <rect x="13.5" y="5" width="6" height="10" rx="1.2"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="11">
    <text x="51" y="15" fill="#010101" fill-opacity=".3">Built for</text>
    <text x="51" y="14">Built for</text>
    <text x="121" y="15" fill="#010101" fill-opacity=".3">iPhone Duo</text>
    <text x="121" y="14">iPhone Duo</text>
  </g>
</svg>
